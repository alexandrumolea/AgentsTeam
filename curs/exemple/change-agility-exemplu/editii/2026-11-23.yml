# [EXEMPLU] Ediție inventată. Ediția reală (cu numele clientului) stă doar în privat/.
data: 2026-11-23
ora_start: "9:00"
# Agenda: ordinea zilei. Un rând = un modul (cu piesele implicite), un modul cu piesele alese,
# o piesă singură (id-ul ei), o pauză scurtă fără fișier (pauza: <minute>) sau „bloc: N” (de aici, blocul N, după pauza fixă).
agenda:
  - deschidere
  - modul: curba
    piese: [model-curba, perechi-curba]   # alternative: plimbare-curba, poveste-fuziune; [] = fără piese
  - pauza-cafea                           # piesă (tip: pauza)
  - ridica-te-daca                        # piesă singură, între module
  - bloc: 2                               # restul după pauza fixă de la 10:30 (curs.yml); cele 5 minute rămase stau libere
  - pasul-de-luni
  - pauza: 10
  - inchidere
# Ecranele din sală (1.10, Alex, 2026-11-17): mutări față de ordinea agendei și ecrane ascunse. Id-urile se văd în vederea Ecrane,
# iar butonul „Copiază pentru ediție” scrie blocul acesta.
ecrane:
  muta:
    - "ridica-te-daca#1 după deschidere#2"   # energizantul, chiar după prezentări
  ascunse:
    - "pasul-de-luni#1"                      # întrebarea o pun cu voce tare, fără ecran
nume_interzise: ["Firma Exemplu", "Ion Exemplescu"]
nota_trainer: "[EXEMPLU] Grup de 14 oameni, două echipe care tocmai au fuzionat."
