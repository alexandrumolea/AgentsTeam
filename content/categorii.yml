# Cele 8 categorii ale atelierului (arhitectura v2, 1.8). Nume: D-025, cu schimbările lui Alex din 2026-11-15 (D-040): Innovations, Latest Workshops, Knowledge Base.
# Citit de scenă, de bara de jos, de varianta fără 3D și de meniul paginilor.
# `cheie` nu se schimbă niciodată. Etichetele și frazele le schimbă Maria, aici, fără cod.
# `stare`: deschis (are conținut real) sau in-pregatire (apare cu textul `in_pregatire` din site.yml).
# `pod`: propoziția-pod a camerei (T-015, Maria). Gol = nu apare.
# `vizibil`: true = secțiunea apare pe site; false = există doar aici, ascunsă peste tot (meniu, legendă,
#   scena 3D, pagină, sitemap, api/continut.json, linkuri). Adresa ei duce la prima pagină.
#   Le facem vizibile pe măsură ce avem ce pune în ele (Alex, D-056, 2026-11-17).
# `panou: false`: pe prima pagină, clicul (pe obiect, în legendă sau pe link) deschide direct pagina, fără panoul din stânga.
# `elemente`: ce găsești într-o secțiune. Fiecare apare ca un rând pe care îl apeși în întregime (pe pagina secțiunii și în panoul
#   de pe prima pagină): simbolul, titlul, „tip · fraza” și săgeata. Câmpuri: `titlu`, `fraza`, fie `pagina` + `slug`, fie `link: https://…`,
#   plus două opționale (2026-11-25):
#   `tip`: eticheta din fața frazei, ex. "Workshop · 4 sau 6 ore", "Ghid", "Proces". Fără `tip`, rândul arată doar fraza.
#   `simbol`: desenul din stânga, unul din: workshop (inel), ghid (foaie), proces (puncte pe linie), aplicatie (telefon), atelier.
#   Fără `simbol`, rândul începe direct cu titlul.

familii:
  - cheie: direct
    titlu: "De ce ai nevoie?"
  - cheie: atelier
    titlu: "Intră în atelier"

categorii:
  - cheie: coaching
    vizibil: true
    eticheta: "Coaching"
    fraza: "Vreau să lucrez cu tine, singur sau cu echipa mea."
    url: coaching
    familie: direct
    dimensiune: munca
    ordine: 1
    pe_orbita: true
    stare: deschis
    pod: ""
    # Faptele confirmate de Alex (2026-11-16). Fiecare rând apare ca o linie: eticheta în stânga, textul în dreapta.
    detalii:
      - eticheta: "Pentru cine"
        text: "oameni și echipe"
      - eticheta: "Unde"
        text: "față în față sau online"
      - eticheta: "Prima conversație"
        text: "gratuită"
    # Paginile din Coaching, fiecare la coaching/<slug>/ (ca la Latest Workshops). `cadru: false`: pagina își aduce singură sticla.
    elemente:
      - titlu: "Pregătește-te pentru prima ta sesiune"
        fraza: "Răspunsuri la întrebările frecvente și câteva întrebări opționale pentru tine."
        tip: "Ghid"
        simbol: ghid
        slug: prima-sesiune
        pagina: content/coaching/prima-sesiune.html
        cadru: false

  - cheie: companie
    vizibil: false
    eticheta: "Compania mea"
    fraza: "Vreau ceva pentru echipa sau compania mea."
    url: business
    familie: direct
    dimensiune: munca
    ordine: 2
    pe_orbita: true
    stare: in-pregatire
    pod: ""

  - cheie: speaking
    vizibil: true
    eticheta: "Latest Workshops"
    fraza: "Vreau să văd ultimele workshopuri."
    url: workshops
    familie: direct
    dimensiune: munca
    ordine: 3
    pe_orbita: true
    stare: deschis
    pod: ""
    # Workshopurile livrate (D-093, pasul 7c din docs/procese/curs-nou.md), fiecare cu pagina lui la workshops/<slug>/.
    # Pagina e un fișier din content/workshops/ (șablonul paginii de curs al Ioanei). Un workshop nou: copiezi
    # change-agility.html, îi schimbi textul și adaugi aici un rând. `cadru: false`: pagina își aduce singură sticla.
    # Opțional, `imagine_linkedin: previzualizari/<slug>.png`: imaginea din previzualizarea linkului (LinkedIn, WhatsApp),
    # un fișier de 1200×630 pus în site/static/previzualizari/. Fără ea se folosește og.png, imaginea generală a site-ului.
    # Imaginea se face dintr-o comandă, din textele paginii: cd site && node previzualizare.mjs <slug>
    elemente:
      - titlu: "Change Agility"
        fraza: "Un workshop în care fiecare pleacă cu planul lui de reinventare."
        tip: "Workshop · 4 sau 6 ore"
        simbol: workshop
        slug: change-agility
        pagina: content/workshops/change-agility.html
        cadru: false
        # imaginea de previzualizare (varianta A a Ioanei, T-057) se face după ce Alex alege subtitlul nou:
        # cd site && node previzualizare.mjs change-agility, apoi scoți # de pe rândul de mai jos.
        # imagine_linkedin: previzualizari/change-agility.png
      - titlu: "Trust & Courage"
        fraza: "Să spui ce ai de spus, să fii ascultat și să se schimbe ceva în relație."
        tip: "Workshop · 4 ore, o zi sau 2 zile"
        simbol: workshop
        slug: trust-courage
        pagina: content/workshops/trust-courage.html
        cadru: false
        imagine_linkedin: previzualizari/trust-courage.png
      - titlu: "Listening & Leading"
        fraza: "Conduci oamenii prin felul în care vorbești cu ei."
        tip: "Workshop · 4 ore, o zi sau 2 zile"
        simbol: workshop
        slug: listening-leading
        pagina: content/workshops/listening-leading.html
        cadru: false
        imagine_linkedin: previzualizari/listening-leading.png
      - titlu: "Teamship – Knowing Your Strengths"
        fraza: "Fiecare își vede punctele forte și înțelege de unde vorbesc colegii."
        tip: "Workshop · 3,5 ore · cu CliftonStrengths®"
        simbol: workshop
        slug: teamship-strengths
        pagina: content/workshops/teamship-strengths.html
        cadru: false
        imagine_linkedin: previzualizari/teamship-strengths.png

  - cheie: inventii
    vizibil: true
    eticheta: "Innovations"
    fraza: "Aici găsești perspectivele pe care le explorez în acest moment. Metode, stil de lucru, cursuri experimentale, care n-au devenit încă servicii sau produse stabile."
    url: innovations
    familie: atelier
    dimensiune: inovatie
    ordine: 1
    pe_orbita: true
    stare: deschis
    pod: ""
    # Elementele secțiunii (Alex, 2026-11-18). Fiecare apare ca un rând-drum (vezi `elemente` sus, în comentariul fișierului).
    # `pagina`: un fișier .html din repo, publicat la innovations/<slug>/ cu antetul și subsolul site-ului.
    #   Sursa e una singură: ce schimbi în fișier apare pe site la următorul build. (Sau `link: https://…` spre altă adresă.)
    #   <title> din fișier e titlul din tab-ul browserului, <meta name="description"> descrierea; `titlu` de aici e cel din listă.
    # Alignment (D-102): un serviciu nou, de aceea stă în Innovations, primul în listă. Simbolul `atelier` e provizoriu, până propune Ioana unul.
    elemente:
      - titlu: "Alignment"
        fraza: "Un serviciu nou: conversația facilitată pe relația dintre doi sau mai mulți oameni care lucrează împreună."
        tip: "Serviciu nou"
        simbol: atelier
        slug: alignment
        pagina: content/innovations/alignment.html
        cadru: false
        imagine_linkedin: previzualizari/alignment.png
      - titlu: "Procesul de training design cu AI"
        fraza: "Cum construim un training cu o echipă de agenți AI și oameni: viziune, Laborator, harvest, firul roșu."
        tip: "Proces"
        simbol: proces
        slug: procesul-de-training-design-cu-ai
        pagina: docs/procese/curs-nou-vizual.html

  - cheie: live
    vizibil: false
    eticheta: "Live"
    fraza: "Ce construim chiar acum."
    url: live
    familie: atelier
    dimensiune: munca
    ordine: 2
    pe_orbita: true
    stare: deschis
    buton: "Tot jurnalul"
    pod: ""

  - cheie: povesti
    vizibil: false
    eticheta: "My Journey"
    fraza: "Vreau să știu prin ce ai trecut și ce ai învățat."
    url: my-journey
    familie: atelier
    dimensiune: viata
    ordine: 3
    pe_orbita: true
    stare: in-pregatire
    pod: ""

  - cheie: knowledge
    vizibil: false
    eticheta: "Knowledge Base"
    fraza: "Ce am învățat construind, nu ce am citit."
    url: knowledge-base
    familie: atelier
    dimensiune: distilat
    ordine: 4
    pe_orbita: true
    stare: in-pregatire
    pod: ""

  - cheie: despre
    vizibil: true
    eticheta: "Despre mine"
    scurt: "Despre"
    fraza: "Vreau să te cunosc."
    url: despre
    panou: false              # Alex, 2026-11-18: „să mi se deschidă direct pagina cu despre mine”
    familie: titlu
    dimensiune: viata
    ordine: 1
    pe_orbita: true
    stare: deschis
    buton: "Pagina Despre"
    pod: ""
