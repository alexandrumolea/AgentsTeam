# Cele 8 categorii ale atelierului (arhitectura v2, 1.8). Nume: D-025, cu schimbările lui Alex din 2026-11-15 (D-040): Innovations, Latest Workshops, Knowledge Base.
# Citit de scenă, de bara de jos, de varianta fără 3D și de meniul paginilor.
# `cheie` nu se schimbă niciodată. Etichetele și frazele le schimbă Maria, aici, fără cod.
# `stare`: deschis (are conținut real) sau in-pregatire (apare cu textul `in_pregatire` din site.yml).
# `pod`: propoziția-pod a camerei (T-015, Maria). Gol = nu apare.

familii:
  - cheie: direct
    titlu: "De ce ai nevoie?"
  - cheie: atelier
    titlu: "Intră în atelier"

categorii:
