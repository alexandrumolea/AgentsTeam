# Cele 8 categorii ale atelierului (arhitectura v2, 1.8). Nume: D-025, cu schimbările lui Alex din 2026-11-15 (D-040): Innovations, Latest Workshops, Knowledge Base.
# Citit de scenă, de bara de jos, de varianta fără 3D și de meniul paginilor.
# `cheie` nu se schimbă niciodată. Etichetele și frazele le schimbă Maria, aici, fără cod.
# `stare`: deschis (are conținut real) sau in-pregatire (apare cu textul `in_pregatire` din site.yml).
# `pod`: propoziția-pod a camerei (T-015, Maria). Gol = nu apare.
# `vizibil`: true = secțiunea apare pe site; false = există doar aici, ascunsă peste tot (meniu, legendă,
#   scena 3D, pagină, sitemap, api/continut.json, linkuri). Adresa ei duce la prima pagină.
#   Le facem vizibile pe măsură ce avem ce pune în ele (Alex, D-056, 2026-11-17).
# `panou: false`: pe prima pagină, clicul (pe obiect, în legendă sau pe link) deschide direct pagina, fără panoul din stânga.

familii:
  - cheie: direct
    titlu: "De ce ai nevoie?"
  - cheie: atelier
    titlu: "Intră în atelier"

categorii:
  - cheie: coaching
    vizibil: true
    eticheta: "Coaching"
    fraza: "Vreau să lucrez cu tine, singur sau cu echipa mea."
    url: coaching
    familie: direct
    dimensiune: munca
    ordine: 1
    pe_orbita: true
    stare: deschis
    pod: ""
    # Faptele confirmate de Alex (2026-11-16). Fiecare rând apare ca o linie: eticheta în stânga, textul în dreapta.
    detalii:
      - eticheta: "Pentru cine"
        text: "oameni și echipe"
      - eticheta: "Unde"
        text: "față în față sau online"
      - eticheta: "Prima conversație"
        text: "gratuită"
    # Paginile din Coaching, fiecare la coaching/<slug>/ (ca la Latest Workshops). `cadru: false`: pagina își aduce singură sticla.
    elemente:
      - titlu: "Pregătește-te pentru prima ta sesiune"
        fraza: "Răspunsuri la întrebările frecvente și câteva întrebări opționale pentru tine."
        slug: prima-sesiune
        pagina: content/coaching/prima-sesiune.html
        cadru: false

  - cheie: companie
    vizibil: false
    eticheta: "Compania mea"
    fraza: "Vreau ceva pentru echipa sau compania mea."
    url: business
    familie: direct
    dimensiune: munca
    ordine: 2
    pe_orbita: true
    stare: in-pregatire
    pod: ""

  - cheie: speaking
    vizibil: true
    eticheta: "Latest Workshops"
    fraza: "Vreau să văd ultimele workshopuri."
    url: workshops
    familie: direct
    dimensiune: munca
    ordine: 3
    pe_orbita: true
    stare: deschis
    pod: ""
    # Workshopurile livrate (D-093, pasul 7c din docs/procese/curs-nou.md), fiecare cu pagina lui la workshops/<slug>/.
    # Pagina e un fișier din content/workshops/ (șablonul paginii de curs al Ioanei). Un workshop nou: copiezi
    # change-agility.html, îi schimbi textul și adaugi aici un rând. `cadru: false`: pagina își aduce singură sticla.
    elemente:
      - titlu: "Change Agility"
        fraza: "Un workshop în care fiecare pleacă cu planul lui de reinventare."
        slug: change-agility
        pagina: content/workshops/change-agility.html
        cadru: false

  - cheie: inventii
    vizibil: true
    eticheta: "Innovations"
    fraza: "Aici găsești perspectivele pe care le explorez în acest moment. Metode, stil de lucru, cursuri experimentale, care n-au devenit încă servicii sau produse stabile."
    url: innovations
    familie: atelier
    dimensiune: inovatie
    ordine: 1
    pe_orbita: true
    stare: deschis
    pod: ""
    # Elementele secțiunii (Alex, 2026-11-18). Fiecare apare ca un rând: titlul (link) și fraza.
    # `pagina`: un fișier .html din repo, publicat la innovations/<slug>/ cu antetul și subsolul site-ului.
    #   Sursa e una singură: ce schimbi în fișier apare pe site la următorul build. (Sau `link: https://…` spre altă adresă.)
    #   <title> din fișier e titlul din tab-ul browserului, <meta name="description"> descrierea; `titlu` de aici e cel din listă.
    elemente:
      - titlu: "Procesul de training design cu AI"
        fraza: "Cum construim un training cu o echipă de agenți AI și oameni: viziune, Laborator, harvest, firul roșu."
        slug: procesul-de-training-design-cu-ai
        pagina: docs/procese/curs-nou-vizual.html

  - cheie: live
    vizibil: false
    eticheta: "Live"
    fraza: "Ce construim chiar acum."
    url: live
    familie: atelier
    dimensiune: munca
    ordine: 2
    pe_orbita: true
    stare: deschis
    buton: "Tot jurnalul"
    pod: ""

  - cheie: povesti
    vizibil: false
    eticheta: "My Journey"
    fraza: "Vreau să știu prin ce ai trecut și ce ai învățat."
    url: my-journey
    familie: atelier
    dimensiune: viata
    ordine: 3
    pe_orbita: true
    stare: in-pregatire
    pod: ""

  - cheie: knowledge
    vizibil: false
    eticheta: "Knowledge Base"
    fraza: "Ce am învățat construind, nu ce am citit."
    url: knowledge-base
    familie: atelier
    dimensiune: distilat
    ordine: 4
    pe_orbita: true
    stare: in-pregatire
    pod: ""

  - cheie: despre
    vizibil: true
    eticheta: "Despre mine"
    scurt: "Despre"
    fraza: "Vreau să te cunosc."
    url: despre
    panou: false              # Alex, 2026-11-18: „să mi se deschidă direct pagina cu despre mine”
    familie: titlu
    dimensiune: viata
    ordine: 1
    pe_orbita: true
    stare: deschis
    buton: "Pagina Despre"
    pod: ""
