# Culorile site-ului. Singurul loc în care se schimbă paleta.
#
# Din acest fișier pleacă tot: CSS-ul (variabilele din :root), gradientul de fundal,
# scena 3D, culoarea barei de adrese pe telefon (theme-color), favicon-ul și imaginea
# de previzualizare (og.png). Ghidul: site/README.md, „Cum schimbi culorile”.
#
# Cum se scrie o valoare:
#   "#2B44B8"          un cod hex (merge și scurt: "#FFF")
#   accent             numele altui rol: culoarea urmează rolul de care ține
#   "#FFFFFF / .80"    o culoare cu transparență (0 = invizibil, 1 = plin)
#   sticla / .93       un rol, cu transparență
# Numele sunt roluri, nu culori: „accent” poate fi albastru azi și verde mâine.
# O greșeală (cod invalid, nume care nu există, contrast prea mic) oprește build-ul, cu mesaj clar.
#
# Paleta Sora (D-054, design v3.1 al Ioanei: team/ioana/documente/design-v3.md).
# Din D-057 (2026-11-17) e brandingul BEMORE: aceiași tokeni îi folosește și tema cursurilor.

# Fonturile, pe roluri. Ambele găzduite pe site (woff2, cu licența SIL OFL lângă).
# Fonturile cunoscute de build: "Sora", "Inter Tight". Altul cere un pachet nou (site/README.md).
fonturi:
  titluri: "Sora"                # titlurile (greutatea 200), marca, numerele mari, inscripția
  text: "Inter Tight"            # textul, meniul, legenda, etichetele, butoanele

culori:
  # --- paleta Sora: cer, lavandă, piersică, portocaliu (afișul fontului Sora) ---
  cer: "#4FA3F0"
  cer-deschis: "#8FD3F7"
  lavanda: "#B7A6EA"
  piersica: "#F7B79A"
  portocaliu: "#F28C3B"

  # --- fundalurile ---
  bg: "#F6F4FA"                  # prima pagină: fundalul liniștit din spatele scenei; și theme-color
  mesh-baza: "#F3EEF6"           # paginile interioare: culoarea de sub gradient

  # --- sticla și textul (textul stă mereu pe sticlă, niciodată direct pe gradient) ---
  sticla: "#FFFFFF"              # baza sticlei
  glass: sticla / .80            # navigarea, panourile, legenda, cardurile
  glass-read: sticla / .93       # unde citești text lung (paginile, panoul deschis)
  glass-edge: "#FFFFFF / .6"     # marginea luminoasă a sticlei
  surface: sticla                # rezerva plină: fără blur sau cu „reduce transparency”
  line: text / .14               # liniile subțiri dintre rânduri
  text: "#14161F"                # textul principal (15,04 în cel mai rău punct)
  muted: "#474A58"               # explicații, date, etichete mici (7,33)
  accent: "#2B44B8"              # linkuri, focus, numerele obiectelor, agenții AI (6,68)
  on-accent: "#FFFFFF"           # textul de pe accent („Sari la conținut”)
  buton: text                    # butonul principal
  pe-buton: "#FFFFFF"            # textul de pe el (18,04)
  punct: portocaliu              # punctul semnului BEMORE (D-058): colțul paginii, centrul scenei, Live (doar decor)
  punct-inel: "#C96A1E"          # inelul subțire al punctului
  umbra: accent                  # umbrele colorate ale sticlei și ale obiectelor (cu transparență mică)

  # --- Live: un singur sens pe culoare ---
  human: "#8A4A14"               # oamenii din Live și „așteaptă decizia lui Alex” (5,70)
  alert: "#A63D2A"               # „blocat”, eroare (manualul de brand v1)
  pressed-bg: text               # „în lucru” acum, pagina curentă, butoanele apăsate
  pressed-fg: "#FFFFFF"          # textul de pe ele

  # --- My Journey: hârtie caldă, fără sticlă ---
  warm-bg: "#FDF3EC"             # hârtia: fundalul panoului My Journey
  warm-text: "#2A1F17"           # textul de pe hârtie
  warm-muted: "#6B5646"          # textul mic de pe hârtie
  warm-accent: "#8A4F27"         # titlurile mișcărilor din poveste
  warm-line: portocaliu          # linia din stânga a fiecărei mișcări (decor)
  warm-divider: warm-text / .16  # liniile subțiri de pe hârtie

  # --- lecțiile (pregătit pentru cursuri; site-ul nu are încă lecții) ---
  # Sage doar în lecții: culoarea a ce faci tu și a ce ai terminat (D-054).
  masa: "#EEF1FB"                # masa de lucru (exercițiul), varianta fără sage
  masa-sage: "#E9EFE4"           # masa de lucru, varianta cu sage
  sage: "#9DB08A"                # doar decor: cercul care respiră, punctul din Live în lecție
  sage-ink: "#4E6B45"            # text: bifa ✓ a lecțiilor parcurse, „Pe masa de lucru” (5,10 pe masă)

# Gradientul de fundal: pete de culoare care se topesc, cu granulație fină deasupra.
# Fiecare pată: [culoare, poziție „x% y%”, mărime „lățime% înălțime%”]. Culoarea poate avea transparență.
mesh:
  pagini:                        # paginile interioare (Despre, camerele, Live, 404)
    baza: mesh-baza
    pete:
      - [cer, "4% 6%", "60% 70%"]
      - [cer-deschis, "70% 0%", "50% 55%"]
      - [lavanda, "32% 80%", "55% 60%"]
      - [piersica, "86% 56%", "50% 60%"]
      - [portocaliu, "100% 100%", "48% 58%"]
  prima-pagina:                  # „1 · Sticlă colorată”: fundalul se liniștește, culoarea trece în obiecte
    baza: bg
    pete:
      - [cer / .30, "0% 0%", "45% 55%"]
      - [portocaliu / .24, "100% 100%", "40% 50%"]
      - [lavanda / .30, "0% 100%", "40% 50%"]
  journey:                       # prima pagină când e deschis My Journey: mai cald
    baza: warm-bg
    pete:
      - [piersica / .55, "70% 30%", "60% 70%"]
      - [portocaliu / .30, "100% 100%", "50% 60%"]
      - [lavanda / .22, "0% 100%", "40% 50%"]

# Contrastul (WCAG 2.2, AA). Build-ul verifică fiecare pereche [text, fundal, prag]
# în cel mai nefavorabil punct: o sticlă transparentă e pusă, fără blur, peste fiecare
# culoare din fiecare gradient de mai sus. O pereche care nu trece oprește build-ul.
contrast:
  - [text, glass, 4.5]
  - [muted, glass, 4.5]
  - [accent, glass, 4.5]
  - [human, glass, 4.5]
  - [alert, glass, 4.5]
  - [text, glass-read, 7]         # textul lung: AAA
  - [muted, glass-read, 4.5]
  - [accent, glass-read, 4.5]
  - [human, glass-read, 4.5]
  - [alert, glass-read, 4.5]
  - [pe-buton, buton, 4.5]
  - [pressed-fg, pressed-bg, 4.5]
  - [on-accent, accent, 4.5]
  - [warm-text, warm-bg, 7]
  - [warm-muted, warm-bg, 4.5]
  - [warm-accent, warm-bg, 4.5]
  - [text, masa, 7]
  - [text, masa-sage, 7]
  - [sage-ink, masa-sage, 4.5]
  - [sage-ink, glass, 4.5]

# Scena 3D (doar prima pagină): lumini, materiale, perechile de gradient ale obiectelor.
# Aici nu se folosește transparența. O pereche [sus, jos] e gradientul unui obiect.
scena:
  bg-warm: warm-bg               # ceața scenei în My Journey (cea normală e `bg`)
  sky: "#FFFFFF"                 # lumina de sus
  sky-warm: "#FFE3D1"
  ground: "#D9D2F0"              # lumina de jos (lavandă deschisă)
  key: "#FFFFFF"                 # lumina principală, dintr-o parte
  key-warm: "#FFD2A8"
  glow: cer-deschis              # lumina din centrul atelierului
  glow-warm: portocaliu
  edge: "#FFFFFF"                # conturul alb al obiectelor
  orbit: accent                  # orbitele desenate (linie punctată, foarte stinsă)
  orbit-light: punct             # cele două lumini mici care se rotesc pe orbite
  # obiectele-simbol: formele din planșa Ioanei (design v3.1), fiecare cu gradientul lui
  obj-coaching: [piersica, lavanda]
  obj-companie: [cer, lavanda]
  obj-speaking: [cer-deschis, lavanda]
  obj-inventii: [lavanda, piersica]
  obj-live: [cer-deschis, cer]
  obj-povesti: [piersica, portocaliu]   # piatra din My Journey: singurul obiect mat
  obj-knowledge: [lavanda, cer-deschis]
  obj-despre: [cer, piersica]           # lentila „Despre mine” (manualul §7: cer → piersică; cer → lavandă e al Companiei mele)
  obj-centru: [cer-deschis, lavanda]    # discurile inovației din centru (doar când Innovations e vizibil)
  # Live: echipa ca rețea
  agent: accent                  # luminițele agenților
  alex: text                     # punctul solid al lui Alex
  network: accent                # firele rețelei
  pulse: punct                   # impulsurile dintre agenți
  bridge: accent                 # podurile dintre camerele vizitate
  bridge-warm: portocaliu        # podurile în My Journey
  door: accent                   # pragul de la intrare
  journey-glow: piersica         # lumina caldă din jurul pietrei
