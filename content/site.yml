# Setările site-ului (D-030: conținutul stă ca date).
# Regula: un câmp gol înseamnă că elementul nu apare. Nu inventăm nimic ca să umplem un loc.
# După o schimbare: commit + push pe main. Site-ul se publică singur în câteva minute.

# Semnătura (D-059, 2026-11-17, Alex, recomandarea Mariei: team/maria/documente/manual-brand-pozitionare-v1.md, secțiunea 4).
# `titlu`: tab-ul primei pagini. `titlu_scurt`: în tab-ul paginilor, după numele paginii („Coaching · Alex”).
titlu: "Alex · Atelier de învățare"
titlu_scurt: "Alex"
descriere: "Construiesc unelte pentru oameni care vor să crească. Sunt Alex: coach, fondator și inventator în domeniul educației."

# Domeniul propriu, fără https:// (ex.: alex.ro). Gol = adresa GitHub Pages.
# Completat → build-ul scrie fișierul CNAME. Domeniul se setează și în GitHub: Settings → Pages → Custom domain.
domeniu: "alexandrumolea.com"

# Publicare fără domeniu, pe linkul GitHub (Alex, 2026-11-15: „Hai să-l facem cu link de GitHub momentan.”).
# true = site-ul se publică la fiecare push, la adresa GitHub Pages. Când `domeniu` e completat, contează domeniul.
publica_pe_link_github: true

# Repo-ul public: „vezi cum se construiește” duce aici. Fără email, fără telefon (acelea vin din secrete, vezi `contact`).
github: "https://github.com/alexandrumolea/AgentsTeam"

# Linkul de rezervare (ex.: Cal.com). Gol = butonul „Rezervă o sesiune” e ascuns peste tot.
rezervare: ""

# Contactul: capsula „Contact” de pe toate paginile (propunerea A a Ioanei, aleasă de Alex pe 2026-11-18:
# team/ioana/documente/contact-propuneri-v1.html). Pe pagină se văd doar iconițele, fără adrese sau numere.
# Canalele: whatsapp, email, linkedin, instagram, substack (iconițele stau în cod, în site/build.mjs).
# WhatsApp și emailul NU se scriu aici (repo-ul e public): build-ul le ia din secretele GitHub
# CONTACT_WHATSAPP (numărul în format internațional, doar cifre, fără „+”) și CONTACT_EMAIL.
# Fără ele (de exemplu la un build local), canalele acelea nu apar. Fără niciun canal, capsula nu apare.
# Dacă `rezervare` are link, primul rând din panou e butonul de rezervare.
contact:
  buton: "Contact"                       # capsula din colț
  titlu: "Hai să vorbim"
  text: "Prima conversație e gratuită."
  rezervare: "Rezervă o sesiune"         # primul rând din panou, doar când `rezervare` are link
  pe_coaching: "Scrie-mi pentru prima conversație"   # butonul de pe Coaching (fără link de rezervare)
  pe_coaching_dupa_rezervare: "Sau scrie-mi"         # butonul de lângă „Alege o oră” (cu link de rezervare)
  pe_despre: "Scrie-mi"                  # butonul din cardul de final de pe Despre
  grupuri:
    - titlu: "Scrie-mi"
      canale:
        - { canal: whatsapp, nume: "Scrie-mi pe WhatsApp" }   # din CONTACT_WHATSAPP
        - { canal: email, nume: "Trimite-mi un email" }       # din CONTACT_EMAIL
    - titlu: "Urmărește-mă aici"
      canale:
        - { canal: linkedin, nume: "LinkedIn", link: "https://www.linkedin.com/in/alexandrumolea/" }
        - { canal: instagram, nume: "Instagram", link: "https://www.instagram.com/alexandrumolea/" }
        - { canal: substack, nume: "Substack", link: "https://alexandrumolea.substack.com" }

# Introducerea, aprobată de Alex (vocea-alex, 2026-11-15). Nu se rescrie fără el.
intro:
  marca: "Alex · Atelier de învățare"   # colțul paginii și imaginea de previzualizare
  marca_scurta: "Alex · Atelier"        # colțul pe telefon
  titlu: "Construiesc unelte pentru oameni care"
  titlu_accent: "vor să crească."
  cine: "Sunt Alex: coach, fondator și inventator în domeniul educației."
  # Inscripția misiunii, cuvintele lui Alex (misiunea v2, 2026-11-15, D-039). Citatul intact apare doar aici și în Despre.
  inscriptie:
    - "Învățarea ca sursă a binelui."
  cum: "Acest site își propune să poți vedea o oglindă aproape în timp real a creierului meu. Ce inovez, la ce lucrez, la ce mă gândesc, cum au mai evoluat convingerile mele."

# Textul pentru camerele și drumurile care încă nu au conținut real.
in_pregatire: "În pregătire. Atelierul e deschis, camera asta se construiește acum."

# Obiectul din centrul scenei: „Desfă invenția”. Gol = fără obiect în centru și fără card.
# Acum e chiar site-ul: singura invenție reală din atelier azi. Straturile, de sus în jos (exact 5 pentru obiectul actual).
in_centru:
  # false = ascuns chiar și cu Innovations vizibil (2026-11-18). Arătarea lui pe prima pagină o decid Alex și Ioana.
  vizibil: false
  eticheta: "Din atelier · în lucru"
  titlu: "Site-ul pe care îl vezi"
  text: "Prima inovație din atelier. Desfă-l și vezi cum funcționează pe dinăuntru."
  buton: "Desfă inovația"
  link_text: "Vezi codul"
  straturi:
    - nume: "Scena"
      text: "Spațiul 3D. Fără 3D, aceleași drumuri, ca listă."
    - nume: "Jurnalul"
      text: "Live se scrie singur, din taskurile echipei și din istoricul git."
    - nume: "Echipa"
      text: "Agenți AI, fiecare cu un rol. Deciziile rămân la Alex."
    - nume: "Conținutul"
      text: "Fișiere text în repo. Un text nou înseamnă un fișier editat."
    - nume: "Baza"
      text: "Structura: Radu. Forma: Ioana. Codul: Mike. Toți agenți AI."

# Echipa de agenți (I-001). Rolurile se citesc automat din team/*/profil.md.
echipa:
  titlu: "Cum lucrez cu echipa mea de agenți"
  text:
    - "Lucrez cu o echipă de agenți AI. Fiecare are un rol, un profil și un scorecard, toate publice."
    - "Își dau taskuri unii altora într-un singur fișier. Deciziile importante rămân la mine."
    - "Tot ce vezi în Live vine din munca reală din repo, nu din texte scrise pentru site."

# Live și Jurnalul atelierului (arhitectura v2, secțiunea 4; filtrul D-032).
live:
  nota: "Agenții sunt AI. Oamenii apar doar cu acordul lor, după 24 de ore, fără oră."
  # Oamenii care au acceptat să apară cu numele (acordul rămâne în afara repo-ului).
  # Oricine altcineva apare ca „un colaborator”.
  oameni_cu_acord:
    - slug: "alex"
      nume: "Alex"
  intarziere_oameni_ore: 24
  ticker_zile: 7
  # Un rând (task sau commit) care conține unul dintre aceste cuvinte nu apare pe site. Fără diferență între majuscule.
  ascunde_daca_contine:
    - "[intern]"
    - "I-012"
    - "povest"
    - "povești"
    - "curious mind"
