<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="2260" viewBox="0 0 1456 2260" role="img" aria-label="Wise Teams. The order as stairs, each step resting on the one before: on the Container, step 1 Aligned (Delivery), step 2 Moving efficiently (Flow and Trust), step 3 Delivering consistently (Delivery), step 4 Building the future (Anticipation), up to an emergent team.">
