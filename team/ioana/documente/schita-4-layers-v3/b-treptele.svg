ciently</text><text x="344" y="1486" font-size="42" font-weight="500" fill="#FFFFFF" text-anchor="start" data-max="968">Work flows, hard things get said</text><rect x="504" y="1080" width="848" height="220" rx="20" fill="#CF4430" /><text x="544" y="1142" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="4" data-max="768">STEP 3 · DELIVERY</text><text x="544" y="1212" font-size="52" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.5" data-max="768">Delivering consistently</text><text x="544" y="1266" font-size="42" font-weight="500" fill="#FFFFFF" text-anchor="start" data-max="768">Results come steadily</text><rect x="704" y="860" width="648" height="220" rx="20" fill="#F4A533" /><text x="744" y="922" font-size="38" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="4" data-max="568">STEP 4 · ANTICIPATION</text><text x="744" y="992" font-size="52" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-0.5" data-max="568">Building the future</text><text x="744" y="1046" font-size="42" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="568">Seeing change early</text><path d="M104 1732 L104 1518 L304 1298 L504 1078 L704 858" stroke="#1C1C1E" stroke-width="5" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/><path d="M704 858 L1106 690" stroke="#1C1C1E" stroke-width="5" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/><circle cx="1202" cy="650" r="170" fill="#F4A533" opacity="0.14"/><circle cx="1202" cy="650" r="100" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="3"/><path d="M1202.0 588.0 L1245.8 606.2" stroke="#1C1C1E" stroke-width="1.6" opacity="0.7"/><path d="M1202.0 588.0 L1264.0 650.0" stroke="#1C1C1E" stroke-width="1.6" opacity="0.7"/><path d="M1202.0 588.0 L1245.8 693.8" stroke="#1C1C1E" stroke-width="1.6" opacity="0.7"/><path d="M1202.0 588.0 L1202.0 712.0" stroke="#1C1C1E" stroke-width="1.6" opacity="0.7"/><path d="M1202.0 588.0 L1158.2 693.