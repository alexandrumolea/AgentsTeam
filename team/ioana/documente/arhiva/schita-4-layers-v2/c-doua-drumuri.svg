<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="1648" viewBox="0 0 1456 1648" role="img" aria-label="Wise Teams. Two paths. Pushing on Delivery works for a moment, becomes allostatic load, and willpower erodes. Building the layers below (Anticipation, Flow, Trust, the Container) makes Delivery follow.">
<style>text{font-family:"Avenir Next", "Poppins", Avenir, "Helvetica Neue", Arial, sans-serif}</style>
<rect width="1456" height="1648" fill="#F6F3EE"/>
<text x="104" y="128" font-size="46" font-weight="700" fill="#9A5A00" text-anchor="start" data-max="600">Wise Teams</text><text x="104" y="254" font-size="88" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1248">The 4 Layers of</text><text x="104" y="352" font-size="88" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1248">How a Team Works</text><text x="104" y="438" font-size="48" font-weight="400" fill="#5E5A55" text-anchor="start" data-max="1248">Where we push, and where results come from.</text><text x="104" y="548" font-size="54" font-weight="700" fill="#B83A28" text-anchor="start" data-max="580">If we push</text><text x="104" y="612" font-size="54" font-weight="700" fill="#B83A28" text-anchor="start" data-max="580">on Delivery</text><text x="772" y="548" font-size="54" font-weight="700" fill="#3A4FC6" text-anchor="start" data-max="580">If we build</text><text x="772" y="612" font-size="54" font-weight="700" fill="#3A4FC6" text-anchor="start" data-max="580">the layers below</text><path d="M234 666 V752" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M212 744 L234 774 L256 744" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M394 666 V752" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M372 744 L394 774 L416 744" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M554 666 V752" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M532 744 L554 774 L576 744" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="104" y="790" width="580" height="140" rx="28" fill="#CF4430" /><text x="394" y="882" font-size="68" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1" data-max="520">Delivery</text><g opacity="1"><path d="M394 922 V972" stroke="#DD4F3B" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M372 964 L394 994 L416 964" stroke="#DD4F3B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="394" y="1060" font-size="50" font-weight="500" fill="#1C1C1E" text-anchor="middle" data-max="580">Works for a moment</text><g opacity="0.8"><path d="M394 1102 V1152" stroke="#DD4F3B" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M372 1144 L394 1174 L416 1144" stroke="#DD4F3B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="394" y="1240" font-size="50" font-weight="500" fill="#1C1C1E" text-anchor="middle" data-max="580">Becomes allostatic load</text><g opacity="0.6"><path d="M394 1282 V1332" stroke="#DD4F3B" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M372 1324 L394 1354 L416 1324" stroke="#DD4F3B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="394" y="1420" font-size="50" font-weight="700" fill="#B83A28" text-anchor="middle" data-max="580">Willpower erodes</text><rect x="772" y="666" width="500" height="116" rx="24" fill="#CF4430" /><text x="808" y="742" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1" data-max="428">Delivery</text><rect x="772" y="796" width="500" height="116" rx="24" fill="#F4A533" /><text x="808" y="872" font-size="56" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="428">Anticipation</text><rect x="772" y="926" width="500" height="116" rx="24" fill="#1B7779" /><text x="808" y="1002" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1" data-max="428">Flow</text><rect x="772" y="1056" width="500" height="186" rx="24" fill="#3A4FC6" /><text x="808" y="1132" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1" data-max="428">Trust</text><g data-chip="1"><rect x="808" y="1160" width="443" height="68" rx="34" fill="#FFD38A" /><text x="1029.5" y="1207.3" font-size="38" font-weight="600" fill="#1C1C1E" text-anchor="middle" data-max="407">the hidden culprit</text></g><rect x="772" y="1266" width="500" height="116" rx="24" fill="#ECE5D9" stroke="#D3C9B8" stroke-width="3"/><text x="808" y="1342" font-size="56" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="428">The Container</text><path d="M1318 1352 V706" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M1298 714 L1318 686 L1338 714" stroke="#1C1C1E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="772" y="1474" font-size="52" font-weight="700" fill="#3A4FC6" text-anchor="start" data-max="580">Delivery follows</text><text x="772" y="1538" font-size="52" font-weight="500" fill="#3A4FC6" text-anchor="start" data-max="580">what holds it.</text><path d="M736 500 V1552" stroke="#D3C9B8" stroke-width="3"/>
</svg>