<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="2032" viewBox="0 0 1456 2032" role="img" aria-label="Wise Teams. The 4 layers of how a team works: Delivery, Anticipation, Flow and Trust, on top of the Container. Trust affects every layer above.">
<style>text{font-family:"Avenir Next", "Poppins", Avenir, "Helvetica Neue", Arial, sans-serif}</style>
<rect width="1456" height="2032" fill="#F6F3EE"/>
<defs><clipPath id="k0"><rect x="104" y="500" width="1180" height="232" rx="28"/></clipPath><clipPath id="k1"><rect x="104" y="754" width="1180" height="232" rx="28"/></clipPath><clipPath id="k2"><rect x="104" y="1008" width="1180" height="232" rx="28"/></clipPath></defs><text x="104" y="128" font-size="46" font-weight="700" fill="#9A5A00" text-anchor="start" data-max="600">Wise Teams</text><text x="104" y="254" font-size="88" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1248">The 4 Layers of</text><text x="104" y="352" font-size="88" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1248">How a Team Works</text><text x="104" y="438" font-size="48" font-weight="400" fill="#5E5A55" text-anchor="start" data-max="1248">What you see at the top has its roots below.</text><rect x="104" y="500" width="1180" height="232" rx="28" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="2"/><rect x="104" y="500" width="18" height="232" fill="#DD4F3B" clip-path="url(#k0)"/><text x="162" y="562" font-size="40" font-weight="700" fill="#B83A28" text-anchor="start" letter-spacing="4" data-max="1080">LAYER 1 · MOST VISIBLE</text><text x="162" y="642" font-size="70" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1080">Delivery</text><text x="162" y="700" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="1080">The effect: where results show up</text><rect x="104" y="754" width="1180" height="232" rx="28" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="2"/><rect x="104" y="754" width="18" height="232" fill="#F4A533" clip-path="url(#k1)"/><text x="162" y="816" font-size="40" font-weight="700" fill="#9A5A00" text-anchor="start" letter-spacing="4" data-max="1080">LAYER 2 · ONCE RESULTS ARE STEADY</text><text x="162" y="896" font-size="70" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1080">Anticipation</text><text x="162" y="954" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="1080">Room for the future, not always firefighting</text><rect x="104" y="1008" width="1180" height="232" rx="28" fill="#FFFFFF" stroke="#E4DDD2" stroke-width="2"/><rect x="104" y="1008" width="18" height="232" fill="#2E9496" clip-path="url(#k2)"/><text x="162" y="1070" font-size="40" font-weight="700" fill="#1B7779" text-anchor="start" letter-spacing="4" data-max="1080">LAYER 3</text><text x="162" y="1150" font-size="70" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1080">Flow</text><text x="162" y="1208" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="1080">Coordination that’s designed, not ossified</text><rect x="104" y="1262" width="1180" height="232" rx="28" fill="#3A4FC6" /><text x="162" y="1324" font-size="40" font-weight="700" fill="#FFD38A" text-anchor="start" letter-spacing="4" data-max="1080">LAYER 4 · HOLDS THE MOST</text><text x="162" y="1404" font-size="70" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-1" data-max="1080">Trust</text><text x="162" y="1462" font-size="46" font-weight="500" fill="#FFFFFF" text-anchor="start" data-max="1080">The hidden culprit behind every layer above</text><g stroke="#3A4FC6" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1284 1378 H1344 V642"/><path d="M1324 650 L1344 622 L1364 650"/><path d="M1344 870 H1286"/><path d="M1344 1124 H1286"/><path d="M1344 616 H1298"/></g><rect x="72" y="1536" width="1312" height="400" rx="32" fill="#ECE5D9" stroke="#D3C9B8" stroke-width="3"/><text x="120" y="1606" font-size="40" font-weight="700" fill="#5E5A55" text-anchor="start" letter-spacing="4" data-max="600">UNDERNEATH</text><text x="120" y="1682" font-size="64" font-weight="700" fill="#1C1C1E" text-anchor="start" data-max="1216">The Container</text><circle cx="129" cy="1744" r="8" fill="#1C1C1E"/><text x="154" y="1758" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">Why we exist</text><circle cx="737" cy="1744" r="8" fill="#1C1C1E"/><text x="762" y="1758" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">Who we exist for</text><circle cx="129" cy="1818" r="8" fill="#1C1C1E"/><text x="154" y="1832" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">What we want to inspire</text><text x="154" y="1888" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">in each other</text><circle cx="737" cy="1818" r="8" fill="#1C1C1E"/><text x="762" y="1832" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">Roles and rules</text>
</svg>