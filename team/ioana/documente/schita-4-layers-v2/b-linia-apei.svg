<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="2140" viewBox="0 0 1456 2140" role="img" aria-label="Wise Teams. The 4 layers as a pyramid: pressure lands on Delivery at the top, the only visible layer. Below the surface: Anticipation, Flow and Trust, the hidden culprit, on top of the Container.">
<style>text{font-family:"Avenir Next", "Poppins", Avenir, "Helvetica Neue", Arial, sans-serif}</style>
<rect width="1456" height="2140" fill="#F6F3EE"/>
<text x="104" y="128" font-size="46" font-weight="700" fill="#9A5A00" text-anchor="start" data-max="600">Wise Teams</text><text x="104" y="254" font-size="88" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1248">The 4 Layers of</text><text x="104" y="352" font-size="88" font-weight="700" fill="#1C1C1E" text-anchor="start" letter-spacing="-1" data-max="1248">How a Team Works</text><text x="104" y="438" font-size="48" font-weight="400" fill="#5E5A55" text-anchor="start" data-max="1248">Delivery is the effect. Its roots are below.</text><text x="728" y="534" font-size="50" font-weight="700" fill="#B83A28" text-anchor="middle" data-max="1200">Pressure works for a moment.</text><text x="728" y="598" font-size="48" font-weight="500" fill="#1C1C1E" text-anchor="middle" data-max="1200">Then it becomes allostatic load.</text><path d="M578 618 V662" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M556 654 L578 684 L600 654" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M728 618 V662" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M706 654 L728 684 L750 654" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M878 618 V662" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M856 654 L878 684 L900 654" stroke="#DD4F3B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M468 700 H988 L1064.304347826087 880 H391.69565217391306 Z" fill="#CF4430"/><text x="728" y="786" font-size="68" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1" data-max="440">Delivery</text><text x="728" y="846" font-size="46" font-weight="500" fill="#FFFFFF" text-anchor="middle" data-max="440">the effect</text><path d="M384.0652173913044 898 H1071.9347826086955 L1156.7173913043478 1098 H299.2826086956522 Z" fill="#F4A533"/><text x="728" y="994" font-size="68" font-weight="700" fill="#1C1C1E" text-anchor="middle" letter-spacing="-1" data-max="607.8695652173913">Anticipation</text><text x="728" y="1054" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="middle" data-max="607.8695652173913">Room for the future</text><path d="M291.6521739130435 1116 H1164.3478260869565 L1257.608695652174 1336 H198.391304347826 Z" fill="#1B7779"/><text x="728" y="1222" font-size="68" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1" data-max="792.695652173913">Flow</text><text x="728" y="1282" font-size="46" font-weight="500" fill="#FFFFFF" text-anchor="middle" data-max="792.695652173913">Designed, not ossified</text><path d="M190.76086956521738 1354 H1265.2391304347825 L1378 1620 H78 Z" fill="#3A4FC6"/><text x="728" y="1446" font-size="70" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1" data-max="994.4782608695652">Trust</text><g data-chip="1"><rect x="486.5" y="1490" width="483" height="72" rx="36" fill="#FFD38A" /><text x="728" y="1540.7" font-size="42" font-weight="600" fill="#1C1C1E" text-anchor="middle" data-max="447">the hidden culprit</text></g><path d="M64 889 H1392" stroke="#1C1C1E" stroke-width="4" stroke-dasharray="4 16" stroke-linecap="round"/><text x="1392" y="865" font-size="40" font-weight="700" fill="#5E5A55" text-anchor="end" letter-spacing="4" data-max="300">SEEN</text><text x="1392" y="947" font-size="40" font-weight="700" fill="#5E5A55" text-anchor="end" letter-spacing="4" data-max="300">UNSEEN</text><rect x="72" y="1644" width="1312" height="400" rx="32" fill="#ECE5D9" stroke="#D3C9B8" stroke-width="3"/><text x="120" y="1714" font-size="40" font-weight="700" fill="#5E5A55" text-anchor="start" letter-spacing="4" data-max="600">UNDERNEATH</text><text x="120" y="1790" font-size="64" font-weight="700" fill="#1C1C1E" text-anchor="start" data-max="1216">The Container</text><circle cx="129" cy="1852" r="8" fill="#1C1C1E"/><text x="154" y="1866" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">Why we exist</text><circle cx="737" cy="1852" r="8" fill="#1C1C1E"/><text x="762" y="1866" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">Who we exist for</text><circle cx="129" cy="1926" r="8" fill="#1C1C1E"/><text x="154" y="1940" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">What we want to inspire</text><text x="154" y="1996" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">in each other</text><circle cx="737" cy="1926" r="8" fill="#1C1C1E"/><text x="762" y="1940" font-size="46" font-weight="500" fill="#1C1C1E" text-anchor="start" data-max="558">Roles and rules</text>
</svg>