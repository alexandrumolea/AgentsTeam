<circle r="92" fill="{{scena.glass-disc}}" fill-opacity=".06" stroke="{{scena.glass-disc}}" stroke-opacity=".5" stroke-width="2"/><circle r="66" fill="none" stroke="{{accent}}" stroke-width="3"/>
